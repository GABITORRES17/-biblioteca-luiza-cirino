#{extends 'main.html' /}
#{set title:'Login' /}

<div class="mx-auto" style="max-width: 420px;">

	<!-- Logo em um quadradinho no meio -->
	<div class="text-center mb-4">
		<img src="@{'/public/images/logo.png'}" alt="Biblioteca Escolar da Luiza"
			style="width: 140px; height: 140px; border-radius: 1.5rem; object-fit: cover; box-shadow: 0 6px 18px rgba(93, 23, 235, 0.25);" />
	</div>

	<form action="@{Logins.logar}" method="post" class="card card-shadow p-4">

		<div class="mb-3">
			<label class="form-label">Nome de Usuário</label>
			<input type="text" name="login" class="form-control" placeholder="Nome de Usuário" />
		</div>

		<div class="mb-4">
			<label class="form-label">Senha</label>
			<input type="password" name="senha" class="form-control" placeholder="Senha" />
		</div>

		<div class="d-grid">
			<button type="submit" class="btn btn-success">
				<i class="fas fa-sign-in-alt me-1"></i> Entrar
			</button>
		</div>
	</form>

	<!-- Cadastro logo abaixo do login -->
	<div class="card card-shadow p-3 mt-3 text-center">
		<p class="mb-2 text-body-secondary">Ainda não tem cadastro?</p>
		<a href="@{Cadastros.formCadastro}" class="btn btn-outline-primary">
			<i class="fas fa-user-plus me-1"></i> Cadastre-se
		</a>
	</div>
</div>
