#{extends 'main.html' /}
#{set title:'Cadastro de Alunos' /}

<form action="@{Cadastros.salvar}" method="post" class="card card-shadow p-4">

	<input type="hidden" name="cadastro.id" value="${c.id}" />

	<div class="mb-3">
		<label class="form-label">Nome de Usuário</label>
		<input type="text" name="cadastro.nome" value="${c.nome}"
	class="form-control #{ifError 'cadastro.nome'}is-invalid#{/ifError}" placeholder="Usuário" />
<div class="invalid-feedback">#{error 'cadastro.nome' /}</div>
	</div>

	<div class="mb-3">
		<label class="form-label">Senha</label>
	<input type="text" name="cadastro.senha" value="${c.senha}"
	class="form-control #{ifError 'cadastro.senha'}is-invalid#{/ifError}" placeholder="Senha" />
<div class="invalid-feedback">#{error 'cadastro.senha' /}</div>
	</div>
	
	<div class="mb-4">
		<label class="form-label">Turma</label>
		<select name="cadastro.turma.id" class="form-select">
		#{list items:turmas, as:'t'}
			<option value="${t.id}" ${t.id == c.turma?.id ? 'selected' : ''}>
			${t.turma}
			</option>
		#{/list}
		</select>
	</div>

	<div>
		<button type="submit" class="btn btn-success">
			<i class="fas fa-save me-1"></i> Cadastrar
		</button>
	</div>
</form>

<div class="mt-3">
	<a href="@{Logins.form}" class="btn btn-outline-primary">
		<i class="fas fa-arrow-left me-1"></i> Retornar
	</a>
</div>

#{if session.perfilUsuario == 'BIBLIOTECARIO'}
<div class="mt-3">
	<a href="@{Cadastros.listar}" class="btn btn-outline-primary">
		<i class="fas fa-arrow-left me-1"></i> Listar de Alunos
	</a>
</div>
#{/if}
