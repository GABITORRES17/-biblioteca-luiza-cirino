#{extends 'main.html' /} #{set title:'Cadastros' /} #{ifErrors}
<div class="alert alert-danger">Revise as informações do
	formulário</div>
#{/ifErrors}

<!-- Título muda conforme é edição ou cadastro novo, agora com ícone -->
#{if l?.id}
<h4 class="mb-3">
	<i class="fas fa-pen text-primary me-2"></i>Edição de Livros
</h4>
#{/if} #{else}
<h4 class="mb-3">
	<i class="fas fa-plus text-primary me-2"></i>Cadastro de Livros
</h4>
#{/else}

<form action="/livros/salvar" method="post" class="card card-shadow p-4">

	<input type="hidden" name="livro.id" value="${l.id}" />

	<div class="mb-3">
		<label class="form-label">Título</label> <input type="text"
			name="livro.titulo" value="${l.titulo}"
			class="form-control #{ifError 'livro.titulo'}is-invalid#{/ifError}" />
		<div class="invalid-feedback">#{error 'livro.titulo' /}</div>
	</div>

	<div class="mb-3">
	<label class="form-label">Autor(a)</label>
	<input type="text" name="livro.autor" value="${l.autor}"
		class="form-control #{ifError 'livro.autor'}is-invalid#{/ifError}" />
	<div class="invalid-feedback">#{error 'livro.autor' /}</div>
</div>

	<div class="mb-3">
	<label class="form-label">Cópias</label>
	<input type="text" name="livro.quantidade" value="${l.quantidade}"
		class="form-control #{ifError 'livro.quantidade'}is-invalid#{/ifError}" />
	<div class="invalid-feedback">#{error 'livro.quantidade' /}</div>
</div>

	<div class="mb-4">
		<label class="form-label">Gênero</label> <select
			name="livro.genero.id" class="form-select"> #{list
			items:generos, as:'g'}
			<option value="${g.id}" ${g.id==l.genero?.id ? 'selected' : ''}>
			${g.genero}
			</option>
			#{/list}
		</select>
	</div>

	<div>
		<button type="submit" class="btn btn-success">
			<i class="fas fa-save me-1"></i> Cadastrar
		</button>
	</div>
</form>

<div class="mt-3">
	<a href="@{Livros.listar}" class="btn btn-outline-primary"> <i
		class="fas fa-arrow-left me-1"></i> Retornar
	</a>
</div>
